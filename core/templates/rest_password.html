<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CGPA Calc</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h2>Reset Password</h2>
        <p class="subtitle">Create a new password for your account</p>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label>New Password</label>
                <div class="password-wrapper">
                    <input type="password" name="password" placeholder="Enter new password" required>
                    <span class="toggle-eye" onclick="togglePassword(this)">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" name="confirm_password" placeholder="Confirm new password" required>
                    <span class="toggle-eye" onclick="togglePassword(this)">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-key"></i> Reset Password
            </button>
        </form>
    </div>

    <script>
        function togglePassword(el) {
            const input = el.closest('.password-wrapper').querySelector('input');
            const icon = el.querySelector('i');
            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";
            icon.classList.toggle("fa-eye");
            icon.classList.toggle("fa-eye-slash");
        }
    </script>
</body>
</html>
